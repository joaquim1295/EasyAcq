# Build Windows bundle on tag push (v*) and attach to GitHub Release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
          python -m pip install --force-reinstall --no-cache-dir "numpy==1.26.4" "matplotlib==3.8.4"

      - name: Verify NumPy 1.26 (no NumPy 2.x no bundle)
        run: python -c "import numpy as np; assert np.__version__.startswith('1.26'), np.__version__"

      - name: Tests
        run: python -m pytest tests -q

      - name: PyInstaller (EasyAcq)
        run: python -m PyInstaller --noconfirm EasyAcq.spec

      - name: Zip application folder
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/EasyAcq" -DestinationPath "dist/EasyAcq-windows.zip" -Force

      - name: Inno Setup (installer)
        run: choco install innosetup -y

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          New-Item -ItemType Directory -Force release | Out-Null
          & $iscc (Join-Path (Get-Location) "packaging\EasyAcq.iss")

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EasyAcq-windows.zip
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
