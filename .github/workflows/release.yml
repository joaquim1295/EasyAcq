# Build Windows (PyInstaller + Inno) ao empurrar tag v*; anexa ZIP e instalador à Release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
          python -m pip install --force-reinstall --no-cache-dir "numpy==1.26.4" "matplotlib==3.8.4"

      - name: Verify NumPy 1.26 (bundle compatível com PCs antigos)
        run: python -c "import numpy as np; assert np.__version__.startswith('1.26'), np.__version__"

      - name: Tests
        run: python -m pytest tests -q

      - name: PyInstaller (EasyAcq)
        run: python -m PyInstaller --noconfirm EasyAcq.spec

      - name: Zip application folder
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/EasyAcq/EasyAcq.exe")) { throw "dist/EasyAcq/EasyAcq.exe em falta" }
          Compress-Archive -Path "dist/EasyAcq" -DestinationPath "dist/EasyAcq-windows.zip" -Force

      - name: Install Inno Setup (Chocolatey)
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup falhou com codigo $LASTEXITCODE" }

      - name: Imagens BMP do assistente Inno
        run: python scripts/render_inno_wizard_bitmaps.py

      - name: Compile installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe nao encontrado. Caminhos testados: $($candidates -join '; '). Confirme 'choco install innosetup'."
          }
          Write-Host "Usando ISCC: $iscc"
          New-Item -ItemType Directory -Force release | Out-Null
          & $iscc (Join-Path (Get-Location) "packaging\EasyAcq.iss")
          if ($LASTEXITCODE -ne 0) { throw "ISCC terminou com codigo $LASTEXITCODE" }
          Get-ChildItem -Path release -Filter "*.exe" | ForEach-Object { Write-Host "Instalador:" $_.FullName $_.Length "bytes" }

      - name: Verify installer exists
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem -Path release -Filter "*.exe" -ErrorAction SilentlyContinue)
          if ($exes.Count -lt 1) {
            Write-Host "Conteudo de release/:"
            Get-ChildItem release -ErrorAction SilentlyContinue
            throw "Nenhum .exe em release/ apos Inno."
          }

      - name: Upload release assets
        uses: softprops/action-gh-release@v2.6.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/EasyAcq-windows.zip
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
